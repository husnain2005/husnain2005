# =============================================================================
# Mosquitto MQTT Broker — CNC Maintenance System
# =============================================================================

# TCP listener (PLC, backend)
listener 1883 0.0.0.0

# WebSocket listener (browser / debug tools)
listener 9001 0.0.0.0
protocol websockets

# Autenticazione anonima (OK per rete locale/VPN)
# Per produzione esposta su internet: impostare allow_anonymous false
# e creare password file con mosquitto_passwd
allow_anonymous true

# Persistenza messaggi
persistence true
persistence_location /mosquitto/data/

# Log
log_dest stdout
log_type all
connection_messages true

# Retain messages (utile per avere sempre l'ultimo valore del sensore)
# I messaggi con retain=true vengono salvati e inviati ai nuovi subscriber
