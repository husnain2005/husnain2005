# =============================================================================
# CNC Maintenance System - Configurazione Nginx di Produzione con SSL/TLS
# =============================================================================
# Questo file configura Nginx come reverse proxy con terminazione SSL,
# sicurezza avanzata, compressione e rate limiting.
# =============================================================================

# --------------------------------------------------------------------------
# Rate Limiting - Protezione contro attacchi brute-force sul login
# --------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# --------------------------------------------------------------------------
# Upstream - Definizione dei servizi backend
# --------------------------------------------------------------------------
upstream backend_api {
    server backend:3001;
    keepalive 32;
}

# =============================================================================
# Server HTTP (porta 80) - Reindirizzamento a HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Nascondi la versione di Nginx per sicurezza
    server_tokens off;

    # Percorso per la verifica ACME di Let's Encrypt (necessario per il rinnovo)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Reindirizza tutto il traffico HTTP a HTTPS (codice 301 permanente)
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# Server HTTPS (porta 443) - Configurazione principale
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN} www.${DOMAIN};

    # Nascondi la versione di Nginx
    server_tokens off;

    # -------------------------------------------------------------------------
    # Certificati SSL - Let's Encrypt
    # -------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # -------------------------------------------------------------------------
    # Impostazioni SSL robuste - Solo TLS 1.2 e 1.3
    # -------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Sessioni SSL ottimizzate
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling - Verifica certificato piu' veloce per i client
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Parametri Diffie-Hellman (generare con: openssl dhparam -out /etc/nginx/dhparam.pem 4096)
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # -------------------------------------------------------------------------
    # Intestazioni di Sicurezza
    # -------------------------------------------------------------------------

    # HSTS - Forza l'uso di HTTPS per 1 anno (inclusi sottodomini)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Impedisce il caricamento in iframe (protezione clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Impedisce al browser di indovinare il tipo MIME
    add_header X-Content-Type-Options "nosniff" always;

    # Protezione XSS del browser
    add_header X-XSS-Protection "1; mode=block" always;

    # Content Security Policy - Controlla quali risorse possono essere caricate
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Controlla quali informazioni vengono inviate nell'intestazione Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disabilita le API del browser non necessarie
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # -------------------------------------------------------------------------
    # Compressione Gzip - Riduce la dimensione delle risposte
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # -------------------------------------------------------------------------
    # Dimensione massima del corpo della richiesta (upload file)
    # -------------------------------------------------------------------------
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # -------------------------------------------------------------------------
    # Proxy API Backend - Tutte le richieste /api vanno al backend Node.js
    # -------------------------------------------------------------------------
    location /api {
        # Rate limiting per tutte le API
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # Timeout per operazioni lunghe (upload file, generazione PDF)
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Buffer per risposte grandi
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # -------------------------------------------------------------------------
    # Rate Limiting Specifico per Login - Protezione brute-force
    # -------------------------------------------------------------------------
    location /api/auth/login {
        # Massimo 5 tentativi al minuto per IP
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------------------------
    # Proxy Upload - Accesso ai file caricati tramite il backend
    # -------------------------------------------------------------------------
    location /uploads {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache per i file statici caricati
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # -------------------------------------------------------------------------
    # Cache per Risorse Statiche (JS, CSS, immagini, font)
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Fallback nel caso il file non esista
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Routing SPA - Tutte le altre rotte servono index.html
    # -------------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache breve per index.html (per aggiornamenti rapidi)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # -------------------------------------------------------------------------
    # Blocca accesso a file nascosti (es. .git, .env)
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Pagina di stato per il monitoraggio (solo accesso locale)
    # -------------------------------------------------------------------------
    location /nginx_status {
        stub_status on;
        allow 127.0.0.1;
        allow 10.0.0.0/24;
        deny all;
    }

    # -------------------------------------------------------------------------
    # Log di accesso e errori
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
