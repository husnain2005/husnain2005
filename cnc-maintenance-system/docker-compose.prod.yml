# =============================================================================
# CNC Maintenance System — Docker Compose PRODUZIONE
# Dominio: gestionalegiana.com
# Uso: docker-compose -f docker-compose.prod.yml up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Database PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: cnc_maintenance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-cnc_maintenance}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # MQTT Broker (Mosquitto)
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cnc_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # TCP  — PLC si connette qui dall'esterno
      - "9001:9001"   # WebSocket
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t health -m ping -q 0 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - public   # esposto per il PLC esterno

  # ---------------------------------------------------------------------------
  # Backend Node.js
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cnc_maintenance_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      NODE_ENV:      production
      PORT:          3001
      TZ:            Europe/Rome
      DB_HOST:       db
      DB_PORT:       5432
      DB_NAME:       ${POSTGRES_DB:-cnc_maintenance}
      DB_USER:       ${POSTGRES_USER:-postgres}
      DB_PASSWORD:   ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatorio}
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET obbligatorio}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      UPLOAD_DIR:    /app/uploads
      BACKUP_DIR:    /app/backups
      MQTT_HOST:     mosquitto
      MQTT_PORT:     1883
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      # Email
      SMTP_PROVIDER: ${SMTP_PROVIDER:-gmail}
      SMTP_USER:     ${SMTP_USER}
      SMTP_PASS:     ${SMTP_PASS}
      SMTP_FROM:     ${SMTP_FROM}
      APP_URL:       https://gestionalegiana.com
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Frontend React (Nginx interno)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cnc_maintenance_frontend
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy pubblico con SSL
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: cnc_maintenance_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - public

  # ---------------------------------------------------------------------------
  # Certbot — Rinnovo automatico certificati Let's Encrypt
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: cnc_maintenance_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - internal

# =============================================================================
# Volumi
# =============================================================================
volumes:
  postgres_data:
    name: cnc_postgres_data
  uploads_data:
    name: cnc_uploads_data
  backups_data:
    name: cnc_backups_data
  frontend_build:
    name: cnc_frontend_build
  mosquitto_data:
    name: cnc_mosquitto_data
  mosquitto_logs:
    name: cnc_mosquitto_logs

# =============================================================================
# Reti
# =============================================================================
networks:
  internal:
    name: cnc_internal_network
    driver: bridge
    internal: true
  public:
    name: cnc_public_network
    driver: bridge
