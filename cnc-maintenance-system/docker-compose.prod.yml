# =============================================================================
# CNC Maintenance System - Docker Compose di Produzione
# =============================================================================
# Configurazione completa per il deployment in produzione con:
# - PostgreSQL (database)
# - Backend Node.js (API)
# - Frontend React (SPA)
# - Nginx (reverse proxy con SSL)
# - Certbot (rinnovo automatico certificati Let's Encrypt)
# - ClamAV (scansione antivirus per Phase 3B)
#
# Utilizzo:
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Database PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: cnc_maintenance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cnc_maintenance}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Backend API Node.js
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cnc_maintenance_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cnc_maintenance}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://your-domain.com}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Frontend React (build statico servito da Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cnc_maintenance_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - frontend_build:/usr/share/nginx/html
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Nginx - Reverse Proxy con SSL/TLS
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: cnc_maintenance_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Certbot - Rinnovo Automatico Certificati SSL Let's Encrypt
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: cnc_maintenance_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Controlla il rinnovo ogni 12 ore (come raccomandato da Let's Encrypt)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # ClamAV - Scansione Antivirus (per Phase 3B - scansione file caricati)
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:stable
    container_name: cnc_maintenance_clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

# =============================================================================
# Volumi Persistenti
# =============================================================================
volumes:
  postgres_data:
    name: cnc_postgres_data
  uploads_data:
    name: cnc_uploads_data
  clamav_data:
    name: cnc_clamav_data
  frontend_build:
    name: cnc_frontend_build

# =============================================================================
# Reti
# =============================================================================
networks:
  internal:
    name: cnc_maintenance_network
    driver: bridge
